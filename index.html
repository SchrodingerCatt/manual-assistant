<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>სასწავლო ასისტენტი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF8F0;
    --paper-line: #E4DCC8;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --geo: #1F7A6C;
    --geo-soft: #E1F0EC;
    --math: #4A3F8C;
    --math-soft: #ECEAF7;
    --accent: var(--geo);
    --accent-soft: var(--geo-soft);
    --radius: 16px;
    --shadow: 0 4px 24px rgba(43, 38, 32, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle, var(--paper-line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Noto Sans Georgian', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px 16px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    text-align: center;
    margin-bottom: 18px;
  }

  .brand h1 {
    font-family: 'Noto Serif Georgian', serif;
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  /* --- საგნების ჩანართები (binder tabs) --- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 0 12px;
  }

  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    font-family: 'Noto Sans Georgian', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    border: none;
    border-radius: 12px 12px 0 0;
    background: #EFE9D8;
    color: var(--ink-soft);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    transform: translateY(6px);
  }

  .tab:hover { transform: translateY(2px); }

  .tab.active {
    background: #FFFFFF;
    color: var(--ink);
    transform: translateY(0);
    box-shadow: var(--shadow);
  }

  .tab .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
  }

  .tab.active .dot {
    opacity: 1;
    background: var(--tab-color, var(--accent));
  }

  .tab[data-subject="geography"].active { --tab-color: var(--geo); }
  .tab[data-subject="math"].active { --tab-color: var(--math); }

  /* --- მთავარი ჩატის ბარათი --- */
  .card {
    background: #FFFFFF;
    border-radius: 0 4px 20px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-top: 3px solid var(--accent);
    transition: border-color 0.25s ease;
  }

  .messages {
    height: 62vh;
    min-height: 340px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 0.97rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.2s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--accent-soft);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }

  .bubble.bot {
    align-self: flex-start;
    background: #F7F4EC;
    border-left: 3px solid var(--accent);
    border-bottom-left-radius: 4px;
  }

  .bubble.bot .source {
    display: block;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
    animation: blink 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* --- მაგალითი კითხვები --- */
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 14px;
  }

  .example-chip {
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 0.83rem;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .example-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* --- შეყვანის არე --- */
  .input-row {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--paper-line);
    background: #FFFFFF;
  }

  #question-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper);
    max-height: 120px;
  }

  #question-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #send-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  #send-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #send-btn:not(:disabled):active { transform: scale(0.94); }

  .footnote {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 14px;
    padding: 0 20px;
  }

  @media (max-width: 480px) {
    .brand h1 { font-size: 1.4rem; }
    .messages { height: 58vh; }
    .bubble { max-width: 90%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <h1>📚 სასწავლო ასისტენტი</h1>
    <p>დამხმარე ბოტი სახელმძღვანელოებში — მხოლოდ მასალის ფარგლებში</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="messages" id="messages"></div>
    <div class="examples" id="examples"></div>
    <div class="input-row">
      <textarea id="question-input" rows="1" placeholder="დაწერე კითხვა..."></textarea>
      <button id="send-btn" aria-label="გაგზავნა">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <p class="footnote">
    ბოტი პასუხობს მხოლოდ სახელმძღვანელოზე დაყრდნობით, არ აფასებს და არ ცვლის მასწავლებელს.
  </p>
</div>

<script>
(() => {
  const tabsEl = document.getElementById('tabs');
  const messagesEl = document.getElementById('messages');
  const examplesEl = document.getElementById('examples');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const card = document.querySelector('.card');

  let SUBJECTS = {};
  let currentSubject = null;
  let isStreaming = false;
  let abortController = null;

  // ერთ სესიაში ინახება მეხსიერებაში (არა დისკზე/ბაზაში) — გვერდის
  // განახლებისას ან ბრაუზერის დახურვისას იკარგება.
  const conversations = {};

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function setAccent(subjectId) {
    const color = subjectId === 'math' ? 'var(--math)' : 'var(--geo)';
    const soft = subjectId === 'math' ? 'var(--math-soft)' : 'var(--geo-soft)';
    document.documentElement.style.setProperty('--accent', color);
    document.documentElement.style.setProperty('--accent-soft', soft);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    Object.values(SUBJECTS).forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (s.id === currentSubject ? ' active' : '');
      btn.dataset.subject = s.id;
      btn.innerHTML = `<span class="dot"></span> ${s.icon} ${escapeHtml(s.display_name)}`;
      btn.addEventListener('click', () => switchSubject(s.id));
      tabsEl.appendChild(btn);
    });
  }

  function renderExamples() {
    examplesEl.innerHTML = '';
    const subject = SUBJECTS[currentSubject];
    if (!subject) return;
    subject.example_questions.forEach(q => {
      const chip = document.createElement('button');
      chip.className = 'example-chip';
      chip.textContent = q;
      chip.addEventListener('click', () => {
        if (isStreaming) return;
        input.value = q;
        sendQuestion();
      });
      examplesEl.appendChild(chip);
    });
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    const conv = conversations[currentSubject] || [];
    conv.forEach(turn => appendBubble(turn.role, turn.content, false));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendBubble(role, text, animate = true) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    if (!animate) bubble.style.animation = 'none';
    bubble.textContent = text;
    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function switchSubject(subjectId) {
    if (subjectId === currentSubject) return;
    if (abortController) abortController.abort();
    isStreaming = false;
    setSendState(false);

    currentSubject = subjectId;
    setAccent(subjectId);
    renderTabs();
    renderExamples();

    if (!conversations[subjectId]) {
      conversations[subjectId] = [
        { role: 'assistant', content: SUBJECTS[subjectId].welcome_message }
      ];
    }
    renderMessages();
  }

  function setSendState(disabled) {
    sendBtn.disabled = disabled;
    input.disabled = disabled;
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question || isStreaming) return;

    conversations[currentSubject].push({ role: 'user', content: question });
    appendBubble('user', question);
    input.value = '';
    autoResize();

    isStreaming = true;
    setSendState(true);

    const botBubble = document.createElement('div');
    botBubble.className = 'bubble bot';
    botBubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    messagesEl.appendChild(botBubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const history = conversations[currentSubject].slice(0, -1).slice(-6);
    abortController = new AbortController();

    let fullText = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject: currentSubject, question, history }),
        signal: abortController.signal,
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        fullText = data.error || 'ბოდიში, დაფიქსირდა ხარვეზი.';
        botBubble.textContent = fullText;
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let firstChunk = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunkText = decoder.decode(value, { stream: true });
          if (!chunkText) continue;
          if (firstChunk) {
            botBubble.innerHTML = '';
            firstChunk = false;
          }
          fullText += chunkText;
          botBubble.textContent = fullText;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        if (firstChunk) {
          // საერთოდ არაფერი არ მოსულა
          botBubble.textContent = 'ბოდიში, პასუხის მიღება ვერ მოხერხდა.';
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        botBubble.textContent = 'კავშირის პრობლემა მოხდა. სცადეთ ხელახლა.';
        fullText = botBubble.textContent;
      } else {
        return; // subject switched mid-stream, discard silently
      }
    } finally {
      isStreaming = false;
      setSendState(false);
      input.focus();
    }

    conversations[currentSubject].push({ role: 'assistant', content: fullText });
  }

  sendBtn.addEventListener('click', sendQuestion);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });
  input.addEventListener('input', autoResize);

  async function init() {
    try {
      const res = await fetch('/api/subjects');
      const data = await res.json();
      SUBJECTS = data.subjects;
      currentSubject = data.default;
    } catch (e) {
      messagesEl.textContent = 'ვერ ხერხდება სერვერთან დაკავშირება. სცადეთ გვერდის განახლება.';
      return;
    }
    setAccent(currentSubject);
    renderTabs();
    renderExamples();
    conversations[currentSubject] = [
      { role: 'assistant', content: SUBJECTS[currentSubject].welcome_message }
    ];
    renderMessages();
    input.focus();
  }

  init();
})();
</script>
</body>
</html>
